services:
  backend:
    build:
      context: .
      dockerfile: ./apps/backend/dockerfile
      target: runtime
    image: memantra/backend:prod
    ports:
      - '${API_PORT:-4000}:3000'
    env_file:
      - ./apps/backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DATABASE_URL: postgresql://postgres:postgres@db:5432/me_mantra_db
      ALLOWED_ORIGINS: http://localhost:8080
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1G

  mobile:
    build:
      context: .
      dockerfile: ./apps/mobile/dockerfile
      target: runtime
      args:
        EXPO_PUBLIC_API_BASE_URL: '${EXPO_PUBLIC_API_BASE_URL:-http://localhost:4000/api}'
    image: memantra/mobile:prod
    ports:
      - '${MOBILE_PORT:-8080}:8080'
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 256M

  db:
    image: postgres:17
    env_file:
      - ./apps/backend/.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: me_mantra_db
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./apps/backend/database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-me_mantra_db}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_prod_data:
