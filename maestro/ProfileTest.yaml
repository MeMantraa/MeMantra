appId: com.memantra.mobile
---
# Profile — view profile, verify user info is displayed
- launchApp:
    clearState: true

# Login
- tapOn: Email
- inputText: e2eTestUser@gmail.com
- hideKeyboard
- tapOn: Password
- inputText: TestPassword123!
- hideKeyboard
- longPressOn: Login
- tapOn:
    text: 'Not Now'
    optional: true

# Navigate to profile via bottom tab
- tapOn:
    point: 90%,97%

# Verify profile elements are visible
- assertVisible: e2eTestUser
- assertVisible: Edit
