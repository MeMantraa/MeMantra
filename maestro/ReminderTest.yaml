appId: com.memantra.mobile
---
# Create a reminder for the current mantra using default routine schedule
- launchApp:
    clearState: true

# Login
- tapOn: Email
- inputText: e2eTestUser@gmail.com
- hideKeyboard
- tapOn: Password
- inputText: TestPassword123!
- hideKeyboard
- longPressOn: Login
- tapOn:
    text: 'Not Now'
    optional: true

# Wait for feed to load
- assertVisible:
    id: feed-list

# Tap the reminder button on the current mantra card
- tapOn:
    id: reminder-button

# Verify we are on the Create Reminder screen
- extendedWaitUntil:
    visible:
      text: 'Create Reminder'
    timeout: 10000

# Scroll down to the Create Reminder button
- scrollUntilVisible:
    element:
      id: create-reminder-button
    direction: DOWN
    timeout: 10000

# The mantra is pre-selected (came from the mantra card)
# Default schedule: Routine, 07:00, Everyday
# Just tap Create Reminder with the defaults
- tapOn:
    id: create-reminder-button

# Dismiss success alert
- tapOn:
    text: 'OK'
    optional: true

# Verify we are back on the feed
- assertVisible:
    id: feed-list
