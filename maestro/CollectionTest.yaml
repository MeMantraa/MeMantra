appId: com.memantra.mobile
---
# Collection flow — navigate to collections and verify screen loads
- launchApp:
    clearState: true

# Login
- tapOn: Email
- inputText: e2eTestUser@gmail.com
- hideKeyboard
- tapOn: Password
- inputText: TestPassword123!
- hideKeyboard
- longPressOn: Login
- tapOn:
    text: 'Not Now'
    optional: true

# Navigate to collections (1st tab, bottom-left)
- tapOn:
    point: 10%,97%

# Verify collections screen loads
- assertVisible: Collections

# Save a mantra to a collection — go back to home first
- tapOn:
    point: 30%,97%

# Wait for feed
- assertVisible:
    id: feed-list

# Tap save button on the mantra
- tapOn:
    id: save-button

# Go back to collections tab
- tapOn:
    point: 10%,97%

# Verify collections screen still works
- assertVisible: Collections
