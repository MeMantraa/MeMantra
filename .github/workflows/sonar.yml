name: SonarQube

on:
  push:
    branches:
      - main
      - branch-*
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend Test and coverage
        run: pnpm --filter backend test -- --coverage --runInBand --watchman=false --forceExit

      - name: Mobile Test and coverage
        timeout-minutes: 25
        run: pnpm --filter mobile test -- --coverage --watchman=false --maxWorkers=50% --forceExit --testTimeout=30000

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
