appId: com.memantra.mobile
---
# Like / Unlike a mantra — toggle the like and verify saved list updates
- launchApp:
    clearState: true

# Login
- tapOn: Email
- inputText: e2eTestUser@gmail.com
- hideKeyboard
- tapOn: Password
- inputText: TestPassword123!
- hideKeyboard
- longPressOn: Login
- tapOn:
    text: 'Not Now'
    optional: true

# Wait for feed to load
- assertVisible:
    id: feed-list

# Tap the like button on the mantra to like it
- tapOn:
    id: like-button

# Tap the like button again to unlike it
- tapOn:
    id: like-button

# Verify feed is still visible
- assertVisible:
    id: feed-list
