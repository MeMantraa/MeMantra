services:
  backend:
    build:
      context: .
      dockerfile: ./apps/backend/dockerfile
      target: dev
    working_dir: /app/apps/backend
    ports:
      - '${API_PORT:-4000}:3000'
    env_file:
      - ./apps/backend/.env
    environment:
      NODE_ENV: development
      CI: '1'
      HUSKY: '0'
      DB_HOST: db
      REDIS_URL: redis://redis:6379
      PNPM_HOME: /root/.local/share/pnpm
      PNPM_CONFIG_STORE_DIR: /root/.local/share/pnpm/store
    entrypoint: ['/bin/sh', '-lc']
    command:
      [
        'pnpm --version && pnpm fetch --prefer-offline || true && if [ ! -x node_modules/.bin/nodemon ]; then echo "Installing backend deps (filtered by name)…"; pnpm -w install --frozen-lockfile --prefer-offline --no-optional --filter backend...; else echo "Deps present, skipping install"; fi && pnpm run dev',
      ]
    volumes:
      - .:/app:delegated
      - root_node_modules:/app/node_modules
      - backend_node_modules:/app/apps/backend/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  #Redis cache
  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  mobile:
    build:
      context: .
      dockerfile: ./apps/mobile/Dockerfile
      target: dev
    working_dir: /app/apps/mobile
    ports:
      - '${MOBILE_PORT:-8081}:8081'
    env_file:
      - ./apps/mobile/.env
    environment:
      CI: '1'
      HUSKY: '0'
      EXPO_PUBLIC_API_BASE_URL: '${EXPO_PUBLIC_API_BASE_URL:-http://localhost:4000/api}'
      PNPM_HOME: /root/.local/share/pnpm
      PNPM_CONFIG_STORE_DIR: /root/.local/share/pnpm/store
    entrypoint: ['/bin/sh', '-lc']
    command:
      [
        'pnpm --version && pnpm fetch --prefer-offline || true && if [ ! -d node_modules/expo ]; then echo "Installing mobile deps..."; pnpm -w install --frozen-lockfile --prefer-offline --no-optional --filter mobile...; else echo "Deps present, skipping install"; fi && pnpm --filter mobile exec expo start --web --host 0.0.0.0 --port 8081',
      ]
    volumes:
      - .:/app:delegated
      - root_node_modules:/app/node_modules
      - mobile_node_modules:/app/apps/mobile/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      backend:
        condition: service_started

  #runs local, containerized db
  db:
    image: postgres:17
    env_file:
      - ./apps/backend/.env
    environment: {}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-me_mantra_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  #PGAdmin UI or local or remote DB
  #run with docker compose --profile pgadmin up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    environment:
      PGADMIN_CONFIG_SERVER_MODE: 'True'
    ports:
      - '5051:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    profiles: ['pgadmin']

  #CI-style test runner
  #run with docker compose --profile tests run --rm pnpm-tests
  pnpm-tests:
    image: node:22
    container_name: memantra_pnpm_tests_${DEV_TAG:-local}
    working_dir: '/app'
    # bind-mount the repo so tests run on your code without building an image
    volumes:
      - .:/app
      - pnpm_store:/root/.pnpm-store
    environment:
      CI: 'true'
    entrypoint: ['/bin/sh', '-lc']
    command:
      [
        'npm i -g pnpm@9.15.9 && pnpm --version && pnpm install --frozen-lockfile && pnpm -w test -- --coverage',
      ]
    profiles: ['tests']

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  root_node_modules:
  backend_node_modules:
  mobile_node_modules:
  pnpm_store:
networks:
  default:
    name: memantra_default
